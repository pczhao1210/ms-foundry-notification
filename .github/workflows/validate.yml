name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            src/requirements.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install -r src/requirements.txt -r requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run offline tests
        run: python -m pytest -q
      - name: Validate deployment script
        run: bash -n deploy.sh
      - name: Install Bicep compiler
        run: az bicep install --version v0.48.1
      - name: Compile infrastructure
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: Check whitespace
        run: git diff --check